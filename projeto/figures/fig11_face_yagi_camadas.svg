<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <!-- External equilateral face and inward shallow tetrahedral cell. -->
  <polygon points="110,650 510,650 310,95" fill="#e8f1f5" stroke="#263746" stroke-width="8"/>
  <polygon points="110,650 510,650 310,455" fill="#dcefe9" stroke="#52606d" stroke-width="5" opacity="0.75"/>
  <line x1="310" y1="455" x2="310" y2="95" stroke="#52606d" stroke-width="5"/>
  <line x1="310" y1="455" x2="110" y2="650" stroke="#52606d" stroke-width="5"/>
  <line x1="310" y1="455" x2="510" y2="650" stroke="#52606d" stroke-width="5"/>

  <!-- Boom collinear with the outward face normal. -->
  <line x1="310" y1="455" x2="730" y2="455" stroke="#263746" stroke-width="18"/>
  <polygon points="760,455 710,425 710,485" fill="#4f887c"/>

  <!-- Crossed VHF/UHF elements, mutually orthogonal and rotated 45 degrees. -->
  <g stroke="#d08b4d" stroke-width="12" stroke-linecap="round">
    <line x1="420" y1="565" x2="560" y2="425"/>
    <line x1="500" y1="540" x2="610" y2="430"/>
    <line x1="575" y1="515" x2="660" y2="430"/>
    <line x1="640" y1="495" x2="705" y2="430"/>
  </g>
  <g stroke="#5f91b7" stroke-width="10" stroke-linecap="round">
    <line x1="440" y1="375" x2="570" y2="505"/>
    <line x1="525" y1="390" x2="625" y2="490"/>
    <line x1="590" y1="400" x2="670" y2="480"/>
    <line x1="650" y1="410" x2="710" y2="470"/>
  </g>

  <!-- Language-neutral exploded material/electronics stack. -->
  <g stroke="#52606d" stroke-width="4">
    <rect x="820" y="100" width="270" height="45" fill="#dcebf2"/>
    <rect x="800" y="180" width="310" height="45" fill="#f2d7a9"/>
    <rect x="780" y="260" width="350" height="45" fill="#d4dde3"/>
    <rect x="760" y="340" width="390" height="45" fill="#cce5d0"/>
    <rect x="780" y="420" width="350" height="45" fill="#ead2d2"/>
    <rect x="800" y="500" width="310" height="45" fill="#dcd4ee"/>
  </g>
  <g stroke="#52606d" stroke-width="4" fill="none">
    <line x1="955" y1="145" x2="955" y2="180"/>
    <line x1="955" y1="225" x2="955" y2="260"/>
    <line x1="955" y1="305" x2="955" y2="340"/>
    <line x1="955" y1="385" x2="955" y2="420"/>
    <line x1="955" y1="465" x2="955" y2="500"/>
  </g>
  <circle cx="890" cy="630" r="55" fill="#d08b4d" stroke="#52606d" stroke-width="5"/>
  <circle cx="1040" cy="630" r="55" fill="#5f91b7" stroke="#52606d" stroke-width="5"/>
</svg>
