<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker>
  <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b74747"/></marker>
  <style>
    .title{font:700 30px sans-serif;fill:#17324d}.h{font:700 20px sans-serif;fill:#17324d}.t{font:16px sans-serif;fill:#263746}.s{font:14px sans-serif;fill:#52606d}.dim{font:700 17px sans-serif;fill:#9a4c2b}.box{stroke:#52606d;stroke-width:2}.thin{stroke:#52606d;stroke-width:2;fill:none}.joint{stroke:#b74747;stroke-width:8;stroke-linecap:round}.shield{stroke:#273746;stroke-width:3;fill:#d9e1e8}.module{stroke:#41677d;stroke-width:2;fill:#cfe3ee}.power{stroke:#c77c2b;stroke-width:2;fill:#fae7cf}.thermal{stroke:#4f887c;stroke-width:2;fill:#dcefe9}
  </style>
</defs>
<rect width="1400" height="900" fill="#ffffff"/>
<text x="700" y="42" text-anchor="middle" class="title">Triangular face, external Yagi and shielded RF layers</text>
<text x="700" y="70" text-anchor="middle" class="s">Face triangular de 2 m, antena Yagi externa, módulos por faixa e junções estruturais internas</text>

<!-- front face -->
<text x="290" y="112" text-anchor="middle" class="h">External face / Face externa</text>
<polygon points="290,155 80,520 500,520" fill="#edf3f7" stroke="#17324d" stroke-width="5"/>
<!-- RF aperture -->
<polygon points="290,215 145,465 435,465" fill="#d6e8f2" stroke="#41677d" stroke-width="3"/>
<text x="290" y="335" text-anchor="middle" class="t">dielectric RF aperture</text>
<text x="290" y="358" text-anchor="middle" class="t">abertura dielétrica RF</text>
<!-- mast and yagi outside -->
<line x1="290" y1="520" x2="290" y2="610" stroke="#7b4b2a" stroke-width="9"/>
<circle cx="290" cy="520" r="12" fill="#b74747"/>
<text x="305" y="584" class="s">base mast / haste na base</text>
<line x1="290" y1="610" x2="290" y2="705" stroke="#7b4b2a" stroke-width="7"/>
<line x1="210" y1="610" x2="370" y2="610" stroke="#7b4b2a" stroke-width="7"/>
<line x1="232" y1="585" x2="232" y2="635" stroke="#7b4b2a" stroke-width="4"/>
<line x1="270" y1="580" x2="270" y2="640" stroke="#7b4b2a" stroke-width="4"/>
<line x1="310" y1="580" x2="310" y2="640" stroke="#7b4b2a" stroke-width="4"/>
<line x1="348" y1="585" x2="348" y2="635" stroke="#7b4b2a" stroke-width="4"/>
<text x="290" y="755" text-anchor="middle" class="t">Yagi / “fishbone” external antenna</text>
<text x="290" y="778" text-anchor="middle" class="s">receives the assigned band; feed passes through sealed interface</text>
<!-- dimensions -->
<line x1="80" y1="535" x2="500" y2="535" stroke="#9a4c2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="290" y="560" text-anchor="middle" class="dim">2.00 m side / lado</text>
<line x1="55" y1="155" x2="55" y2="520" stroke="#9a4c2b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="40" y="345" transform="rotate(-90 40 345)" text-anchor="middle" class="dim">preliminary height / altura</text>

<!-- layer stack -->
<text x="930" y="112" text-anchor="middle" class="h">Exploded layer stack / Camadas em corte</text>
<rect x="650" y="145" width="560" height="52" class="box" fill="#e7eef3"/><text x="930" y="178" text-anchor="middle" class="t">1. Outer dielectric skin: quartz/GFRP / Pele dielétrica externa</text>
<rect x="650" y="212" width="560" height="52" class="box" fill="#faedcf"/><text x="930" y="245" text-anchor="middle" class="t">2. Honeycomb or low-loss foam core / Núcleo colmeia ou espuma</text>
<rect x="650" y="279" width="560" height="52" class="box" fill="#e7eef3"/><text x="930" y="312" text-anchor="middle" class="t">3. Inner dielectric skin / Pele dielétrica interna</text>
<rect x="650" y="346" width="560" height="52" class="box" fill="#cfe3ee"/><text x="930" y="379" text-anchor="middle" class="t">4. RF aperture and PCB / Abertura RF e PCB</text>
<rect x="650" y="413" width="560" height="52" class="box shield"/><text x="930" y="446" text-anchor="middle" class="t">5. Shielded band modules / Módulos blindados por faixa</text>
<rect x="650" y="480" width="560" height="52" class="box module"/><text x="930" y="513" text-anchor="middle" class="t">Band A: ADC + ASIC / Faixa A: ADC + ASIC</text>
<rect x="650" y="547" width="560" height="52" class="box module"/><text x="930" y="580" text-anchor="middle" class="t">Band B: ADC + ASIC / Faixa B: ADC + ASIC</text>
<rect x="650" y="614" width="560" height="52" class="box module"/><text x="930" y="647" text-anchor="middle" class="t">Band N: ADC + ASIC / Faixa N: ADC + ASIC</text>
<rect x="650" y="681" width="560" height="52" class="box thermal"/><text x="930" y="714" text-anchor="middle" class="t">6. Central face module: FFASIC, clock, fibre / Módulo central da face</text>
<rect x="650" y="748" width="560" height="52" class="box power"/><text x="930" y="781" text-anchor="middle" class="t">7. DC, thermal plate and monitoring / DC, placa fria e monitoramento</text>

<!-- joints and isolation callouts -->
<line x1="505" y1="470" x2="635" y2="470" stroke="#b74747" stroke-width="3" marker-end="url(#redarrow)"/>
<text x="515" y="450" class="s">internal joint line / linha de junção interna</text>
<line x1="505" y1="505" x2="635" y2="540" stroke="#b74747" stroke-width="3" marker-end="url(#redarrow)"/>
<text x="515" y="570" class="s">mechanical ring + sealed seam</text>
<text x="515" y="590" class="s">anel estrutural + vedação</text>
<text x="650" y="850" class="s">Design intent: conductive shields, RF gaskets and mechanically continuous internal joints isolate adjacent faces while preserving a dielectric external aperture.</text>
<text x="650" y="872" class="s">Objetivo: blindagens, juntas RF e junções internas contínuas isolam faces vizinhas sem bloquear a abertura dielétrica externa.</text>
</svg>
